bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    # controller server parameters (see Controller Server for more info)
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker] # progress_checker_plugin: "progress_checker" For Humble and older
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 10.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.3  # was 0.5; keep below min_lookahead_dist
      yaw_goal_tolerance: 3.2  # was 0.5; frontier goals carry no meaningful heading (yaw 0), and turning to it with the pivot speed floor could spin until the progress checker aborted
      stateful: True

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      transform_tolerance: 1.0
      desired_linear_vel: 0.5  # was 0.3; 0.5 (500 servo units) is what drives the rover well from the keyboard

      use_velocity_scaled_lookahead_dist: True
      lookahead_dist: 0.6  # between min and max lookahead
      min_lookahead_dist: 0.4  # must stay above xy_goal_tolerance: Humble RPP treats a carrot closer than it as the goal and only turns (was 0.3, which made the rover turn forever)
      max_lookahead_dist: 1.2  # was 0.9; stays inside the 3 x 3 m local costmap
      lookahead_time: 1.5

      approach_velocity_scaling_dist: 1.0
      min_approach_linear_velocity: 0.3  # was 0.05, then 0.1: weaker commands barely move the servos
      use_regulated_linear_velocity_scaling: True
      use_cost_regulated_linear_velocity_scaling: True
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.3

      use_collision_detection: False
      max_allowed_time_to_collision_up_to_carrot: 1.0

      use_rotate_to_heading: True  # turn in place towards the path first (was False)
      rotate_to_heading_angular_vel: 0.6  # was 1.8; fast turns smeared the map
      rotate_to_heading_min_angle: 0.52  # was 0.785 (45 deg): turn in place first above 30 deg, then follow gentle arcs; a carrot at 45 deg left made RPP alternate between pivoting and 0.28 m arcs
      max_angular_accel: 15.0  # was 3.2. RPP limits the turn-in-place rate to the measured odom rate + accel*dt: from standstill 3.2*0.05 = 0.16 rad/s, too weak to move the servos, so the rover never turned

      max_robot_pose_search_dist: 25.0
      allow_reversing: False  # RPP refuses reversing together with rotate-to-heading (was True)

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: True
      width: 3  # was 1 m: RPP saw the goal as always near (permanent slowdown)
      height: 3
      resolution: 0.05
      footprint: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"
      plugins: [obstacle_layer, inflation_layer]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.2  # was 0.4: the rover could not plan out of spots 15-35 cm from a wall
      # RPLIDAR C1 is the driving sensor: it feeds obstacle avoidance here.
      # The Gemini 335 is reserved for the vision map (rtabmap) and is not in
      # this loop - see voxel_layer below to put it back.
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: True
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          # RPLIDAR C1: 0.05-12 m
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -2.0
          inf_is_valid: true
          clearing: True
          marking: True
      # Not in `plugins` above. Add "voxel_layer" back to the list to also mark
      # obstacles from the Gemini 335 point cloud (catches low obstacles and
      # overhangs that a 2D scan at lidar height misses).
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: True
        footprint_clearing_enabled: true
        max_obstacle_height: 3.0
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        observation_sources: rgbd_camera
        rgbd_camera:
          # Orbbec Gemini 335 point cloud (see rover_bringup/launch/gemini_335.launch.py)
          topic: /camera/depth/points
          max_obstacle_height: 3.0
          min_obstacle_height: 0.2
          # Gemini 335 optimal depth range is 0.26-3 m
          obstacle_max_range: 2.5
          obstacle_min_range: 0.26
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          clearing: True
          marking: True
          data_type: PointCloud2
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: True
      # RPLIDAR C1 is the driving sensor: it feeds obstacle avoidance here.
      # The Gemini 335 is reserved for the vision map (rtabmap) and is not in
      # this loop - see voxel_layer below to put it back.
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: True
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          # RPLIDAR C1: 0.05-12 m
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -2.0
          inf_is_valid: true
          clearing: True
          marking: True
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.35  # >= inscribed radius 0.3: the 2D planner checks only the centre
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: turtlebot3_world.yaml

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    use_sim_time: True

    # The rover turns in place, so the planner needs no turning-radius model: a 2D grid
    # A* path, and RPP rotates the rover to the path heading on the spot. The Hybrid-A*
    # (Dubins, 0.4 m radius, no reverse) found no path when the rover faced a wall.
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.15  # was 0.25: a path ending 0.25 m short of the goal could leave the rover outside xy_goal_tolerance (0.3)
      downsample_costmap: False
      downsampling_factor: 1
      allow_unknown: True           # frontiers border unknown space
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0        # [s]
      cost_travel_multiplier: 2.0   # keep to the middle of corridors
      use_final_approach_orientation: False
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: OPEN_LOOP
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
