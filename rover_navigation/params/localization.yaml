# Nav2 localization on a previously saved map (map_server + AMCL).
#
# Used when driving a map made earlier with slam_toolbox:
#   ros2 run nav2_map_server map_saver_cli -f ~/maps/my_map
#   ros2 launch rover_navigation bringup.launch.py map:=$HOME/maps/my_map.yaml
#
# AMCL owns map -> odom in this mode, so slam_toolbox must NOT be running
# (rover_localization's localization.launch.py takes slam:=off).
#
# AMCL needs odom -> base_link, which comes from the EKF fed by
# rf2o_laser_odometry - the rover has no wheel encoders.

amcl:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # Particle filter
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.15
    update_min_a: 0.15
    resample_interval: 1
    transform_tolerance: 0.5
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    save_pose_rate: 0.5
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

    # Motion model noise. rf2o is scan-matched rather than wheel-derived, so it
    # is smoother than encoder odometry but drifts differently; these are on the
    # permissive side. Tighten once you see how it behaves on your terrain.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Beam model, sized for the RPLIDAR C1 (0.05-12 m, 360 deg)
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.05
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    pf_err: 0.05
    pf_z: 0.99
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden by the `map` launch argument of bringup.launch.py
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True
